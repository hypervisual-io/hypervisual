[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypervis"
version = "0.1.0"
description = "Short alias for the HyperVisual CLI launcher (`hypervisual`): architecture diagrams as code."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = ["hypervisual==0.1.0"]

[project.urls]
Homepage = "https://hypervisual.io"
Repository = "https://github.com/hypervisual-io/hypervisual"

[project.scripts]
hypervis = "hypervisual.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hypervis"]
