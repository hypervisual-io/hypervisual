name: Release CLI

# Builds `hypervis` from the private hypervisual-io/cli repo, attests the
# archives and install.sh, and creates a DRAFT release here. Publishing the
# draft (which creates the tag) stays manual. See RELEASING.md.
#
# This repo is public, so its Actions logs and artifacts are public too: never
# upload or print the CLI source. Builds use short diagnostics and no caches.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.2.0 (must equal the hvis-cli crate version with a leading v)"
        required: true
        type: string
      cli_ref:
        description: "hypervisual-io/cli ref to build (default: the tag named by version)"
        required: false
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  CLI_REPO: hypervisual-io/cli

jobs:
  prepare:
    name: Check version and resolve CLI commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version_number: ${{ steps.check.outputs.version_number }}
      cli_sha: ${{ steps.check.outputs.cli_sha }}
      build_date: ${{ steps.check.outputs.build_date }}
    steps:
      - name: Validate inputs
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must look like v1.2.3 or v1.2.3-rc.1, got '$VERSION'"
            exit 1
          fi
          if [ -n "$(git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/$VERSION")" ]; then
            echo "::error::tag $VERSION already exists in $GITHUB_REPOSITORY; the draft would not target this commit"
            exit 1
          fi

      - name: Check out CLI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CLI_REPO }}
          ref: ${{ inputs.cli_ref || inputs.version }}
          ssh-key: ${{ secrets.CLI_DEPLOY_KEY }}
          persist-credentials: false
          path: cli

      - name: Check CLI version
        id: check
        working-directory: cli
        run: |
          crate_version="$(python3 - <<'EOF'
          import tomllib
          package = tomllib.load(open("crates/hvis-cli/Cargo.toml", "rb"))["package"]
          version = package["version"]
          if isinstance(version, dict) and version.get("workspace"):
              version = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          print(version)
          EOF
          )"
          if [ "$crate_version" != "${VERSION#v}" ]; then
            echo "::error::hvis-cli version is $crate_version, but the release version is $VERSION"
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          {
            echo "version_number=$crate_version"
            echo "cli_sha=$sha"
            echo "build_date=$(TZ=UTC git log -1 --format=%cd --date=format-local:%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"
          echo "Building hvis-cli $crate_version from $CLI_REPO@$sha"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            cargo_target: x86_64-unknown-linux-gnu.2.28
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            cargo_target: aarch64-unknown-linux-gnu.2.28
          - target: aarch64-apple-darwin
            runner: macos-15
            cargo_target: aarch64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      CARGO_TARGET: ${{ matrix.cargo_target }}
      VERSION_NUMBER: ${{ needs.prepare.outputs.version_number }}
    steps:
      - name: Check out CLI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.CLI_REPO }}
          ref: ${{ needs.prepare.outputs.cli_sha }}
          ssh-key: ${{ secrets.CLI_DEPLOY_KEY }}
          persist-credentials: false
          path: cli

      - name: Install Rust toolchain
        working-directory: cli
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          [ -n "$channel" ] || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$channel" --profile minimal --target "$TARGET"
          rustc --version

      - name: Install cargo-zigbuild
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$RUNNER_TEMP/zigbuild"
          cat > "$RUNNER_TEMP/zigbuild-requirements.txt" <<'EOF'
          ziglang==0.17.1 \
              --hash=sha256:ea6cc5d87b033cf0aedfbc8f9549a908cae6c50ac31f1698188fa48a74524b54 \
              --hash=sha256:b7c5f02fccd40f89b999ee16a1f5ddced56e6182370f8affe494bcf8a28cf07e
          cargo-zigbuild==0.24.1 \
              --hash=sha256:238a1ab54a95053a4eadc34775c81f795a8ad75f80bfed63f3f445f518102375 \
              --hash=sha256:07c5e3dcddf208500462ec927c556bb306cca2b533b0abe29446bffb63767b85
          EOF
          "$RUNNER_TEMP/zigbuild/bin/pip" install --quiet --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/zigbuild-requirements.txt"
          echo "$RUNNER_TEMP/zigbuild/bin" >> "$GITHUB_PATH"

      - name: Build
        working-directory: cli
        env:
          HVIS_BUILD_COMMIT: ${{ needs.prepare.outputs.cli_sha }}
          HVIS_BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
        run: |
          if [ "$RUNNER_OS" = Linux ]; then build=zigbuild; else build=build; fi
          cargo "$build" --release --locked -p hvis-cli --bin hypervis \
            --target "$CARGO_TARGET" --quiet --message-format short
          echo "BIN=$PWD/target/$TARGET/release/hypervis" >> "$GITHUB_ENV"

      - name: Check glibc requirement
        if: runner.os == 'Linux'
        run: |
          max="$(objdump -T "$BIN" | grep -o 'GLIBC_[0-9.]*' | sed 's/^GLIBC_//' | sort -uV | tail -n 1)"
          echo "highest GLIBC symbol version: $max"
          if [ "$(printf '%s\n' "$max" 2.28 | sort -V | tail -n 1)" != 2.28 ]; then
            echo "::error::$TARGET binary needs glibc $max, expected at most 2.28"
            exit 1
          fi

      - name: Smoke test
        run: |
          out="$("$BIN" --version)"
          echo "$out"
          case "$out" in
            *"$VERSION_NUMBER"*) ;;
            *) echo "::error::'hypervis --version' does not mention $VERSION_NUMBER"; exit 1 ;;
          esac
          cat > "$RUNNER_TEMP/smoke.hvis" <<'EOF'
          Smoke[unstructured]:
            - Client[service]
            - Api[service]
            - Client --> Api: "calls"
          EOF
          "$BIN" validate "$RUNNER_TEMP/smoke.hvis"

      - name: Package
        run: |
          mkdir -p "$RUNNER_TEMP/stage" dist
          cp "$BIN" "$RUNNER_TEMP/stage/hypervis"
          chmod 755 "$RUNNER_TEMP/stage/hypervis"
          archive="hypervis-$TARGET.tar.gz"
          if [ "$RUNNER_OS" = macOS ]; then
            # bsdtar: no AppleDouble files or com.apple.* xattr headers
            export COPYFILE_DISABLE=1
            tar_opts=(--no-xattrs --uid 0 --gid 0)
          else
            tar_opts=(--owner=0 --group=0 --numeric-owner)
          fi
          tar "${tar_opts[@]}" -czf "dist/$archive" -C "$RUNNER_TEMP/stage" hypervis
          tar -tzvf "dist/$archive"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Assemble and attest
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out this repo (for install.sh)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: site

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: assets

      - name: Add install.sh and SHA256SUMS
        working-directory: assets
        run: |
          for sum in *.tar.gz.sha256; do sha256sum -c "$sum"; done
          cp ../site/install.sh install.sh
          sha256sum hypervis-*.tar.gz install.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets/hypervis-*.tar.gz
            assets/install.sh

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: assets/
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create draft release
    needs: [prepare, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CLI_SHA: ${{ needs.prepare.outputs.cli_sha }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets

      - name: Verify assets
        working-directory: assets
        run: |
          sha256sum -c SHA256SUMS
          for f in hypervis-*.tar.gz install.sh; do
            gh attestation verify "$f" --repo "$GH_REPO"
          done

      - name: Create draft release
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::a release for $VERSION already exists (possibly a draft); delete it first"
            exit 1
          fi
          base="$GITHUB_SERVER_URL/$GH_REPO/releases/download/$VERSION"
          cat > notes.md <<EOF
          Built from $CLI_REPO@${CLI_SHA:0:7} by [this workflow run]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID).

          Install this release:

          \`\`\`sh
          curl -fsSL $base/install.sh | HYPERVISUAL_VERSION=$VERSION sh
          \`\`\`

          ## Verify

          Each archive and \`install.sh\` has a GitHub build provenance attestation:

          \`\`\`sh
          gh attestation verify hypervis-x86_64-unknown-linux-gnu.tar.gz --repo $GH_REPO
          \`\`\`

          Checksums: \`sha256sum -c SHA256SUMS --ignore-missing\` (macOS: \`shasum -a 256 -c SHA256SUMS --ignore-missing\`).
          EOF
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$VERSION" assets/* \
            --draft "${prerelease[@]}" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md \
            --generate-notes
